[project]
name = "msg-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "eritainn7",email = "sanyapridava@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "uvicorn (>=0.54.0,<0.55.0)",
    "fastapi (>=0.162.0,<0.163.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "langchain (>=1.4.7,<2.0.0)",
    "langgraph (>=1.2.17,<2.0.0)",
    "sqlalchemy (>=2.1.6,<3.0.0)"
]

[tool.poetry]
packages = [{include = "msg_agent", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
